name: SUZURI existing design placement audit (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing product placement and artwork (GET only)
        env:
          SUZURI_API_TOKEN: ${{ secrets.SUZURI_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, struct, sys, urllib.request, urllib.error
          token = os.getenv("SUZURI_API_TOKEN")
          if not token:
              sys.exit("Missing SUZURI_API_TOKEN")
          def get(path):
              req = urllib.request.Request("https://suzuri.jp/api/v1" + path,
                  headers={"Authorization": "Bearer " + token, "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  sys.exit(f"GET {path.split('?')[0]} failed: HTTP {exc.code}")
          user = get("/user").get("user", {})
          if user.get("name") != "introvert-club":
              sys.exit("Wrong SUZURI account. Audit stopped.")
          products = get("/products?materialId=19942047&itemId=1&userName=introvert-club").get("products", [])
          matches = [p for p in products if p.get("material", {}).get("id") == 19942047 and p.get("item", {}).get("id") == 1]
          if len(matches) != 1:
              sys.exit("Expected exactly one original T-shirt")
          p = matches[0]
          print("Original product ID:", p["id"])
          print("Original material ID:", p["material"]["id"])
          print("Original margin:", p["material"].get("price"))
          print("Original variant ID:", p.get("exemplaryItemVariantId", p.get("exemplaryItemVariant", {}).get("id")))
          print("Original placement-related fields (values only, no URLs):")
          def walk(obj, prefix="", depth=0):
              if depth > 5 or not isinstance(obj, (dict, list)):
                  return
              if isinstance(obj, list):
                  for i, v in enumerate(obj[:5]):
                      walk(v, f"{prefix}[{i}]", depth + 1)
              else:
                  for k, v in obj.items():
                      key = f"{prefix}.{k}" if prefix else k
                      if any(word in k.lower() for word in ("placement", "offset", "scale", "adjustment", "printside", "printplace", "submaterial", "printsize", "originalwidth", "originalheight")):
                          if isinstance(v, (int, float, bool, str)) and len(str(v)) < 150 and "url" not in k.lower():
                              print(f"  {key}: {v}")
                      if isinstance(v, (dict, list)):
                          walk(v, key, depth + 1)
          walk(p)
          try:
              material = get("/materials/19942047").get("material", {})
              print("Material image dimensions:", material.get("originalWidth"), "x", material.get("originalHeight"))
              walk(material, "material")
          except SystemExit:
              print("Material detail not available; continuing with product data")
          for path in ("assets/images/logo.png", "introvertclub_friends_back_transparent.png"):
              b = pathlib.Path(path).read_bytes()
              if b[:8] != b"\x89PNG\r\n\x1a\n":
                  sys.exit(f"Not PNG: {path}")
              w, h = struct.unpack(">II", b[16:24])
              print(f"Artwork {path}: {w} x {h} pixels, {len(b)} bytes")
          print("READ-ONLY AUDIT COMPLETE. No products created or modified.")
          PY
