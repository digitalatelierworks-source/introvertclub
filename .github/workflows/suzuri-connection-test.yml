name: SUZURI connection test (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check SUZURI API token and existing product (GET only)
        env:
          SUZURI_API_TOKEN: ${{ secrets.SUZURI_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          token = os.environ.get("SUZURI_API_TOKEN")
          if not token:
              sys.exit("Missing SUZURI_API_TOKEN secret. Add it under repository Settings > Secrets and variables > Actions.")
          url = "https://suzuri.jp/api/v1/products/19942047"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
          }, method="GET")
          try:
              with urllib.request.urlopen(req, timeout=25) as resp:
                  result = json.load(resp)
          except urllib.error.HTTPError as err:
              sys.exit(f"Read-only SUZURI API request failed: HTTP {err.code}")
          except Exception as err:
              sys.exit(f"Connection failed: {type(err).__name__}")
          product = result.get("product", {})
          item = product.get("item", {})
          print("SUZURI API authentication: OK")
          print("Source product ID:", product.get("id"))
          print("Item ID:", item.get("id"))
          print("Available print places:", item.get("availablePrintPlaces"))
          print("Multi-print:", item.get("isMultiPrintable"))
          print("Read-only check completed. No changes were made.")
          PY
