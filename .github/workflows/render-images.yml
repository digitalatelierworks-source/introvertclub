name: Render Introvert Club images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: python -m pip install -r automation/render-requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Render catalog and report
        run: python automation/render_images.py --output output/render-images
      - name: Upload PNGs and report including REVIEW or ERROR results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: introvertclub-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/render-images/
          if-no-files-found: warn
          retention-days: 7
